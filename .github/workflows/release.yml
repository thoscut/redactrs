name: Release

# Baut die Release-Artefakte und veroeffentlicht sie als GitHub-Release.
#
# Zwei Wege fuehren hierher:
#   * `push` eines Tags `v*`   - der Tag existiert bereits
#   * `workflow_call` aus publish-release.yml bzw. `workflow_dispatch` -
#     der Tag wird erst vom Release selbst angelegt
#
# Beide Wege durchlaufen zwingend `verify` und danach `ci`. Vorher konnte der
# Tag-Weg an der Versionspruefung vorbei: `git tag v9.9.9` erzeugte ein
# Archiv namens `redact-rs-9.9.9-...`, dessen Binary sich als 0.1.0 meldete.
#
# WARUM HIER EIN CI-TOR STEHT
# `verify` hat immer nur Versionsnummer und Tag geprueft, nie den Code. Es gab
# in diesem Workflow keinen einzigen Test-, Clippy-, fmt- oder deny-Schritt -
# nur `cargo build --release`. Damit konnte aus rotem Code ein
# oeffentliches Binary werden, und genau das ist passiert: Lauf 30740996889
# ("Publish Release", Commit 9aa4808) endete `success` und hat v0.3.0
# veroeffentlicht, waehrend die CI-Laeufe **desselben Commits**
# (30740996865 und 30741004317) beide `failure` meldeten.
#
# Der Job `ci` ruft deshalb .github/workflows/ci.yml als wiederverwendbaren
# Workflow auf - dieselbe Datei, die auch auf jedem Push laeuft, keine
# Kopie, die auseinanderlaufen kann. Er ist Vorbedingung fuer `build` und
# `release`. Das kostet die CI-Zeit ein zweites Mal; dafuer traegt sich der
# Release selbst und haengt nicht daran, dass irgendwo ein fremder Lauf mit
# einem brauchbaren Ergebnis herumliegt. Ein *fehlender* Lauf kann so gar
# nicht erst als "in Ordnung" durchgehen: wenn ci.yml nicht aufloesbar ist,
# startet der Workflow nicht.
#
# WELCHER COMMIT
# `verify` loest den Ref genau einmal zu einer Commit-ID auf und gibt sie
# weiter; `ci`, `build` und `release` checken diese ID aus. Vorher hat jeder
# Job den Ref selbst aufgeloest - bei einem Branch-Ref konnten also getestet
# und gebaut worden sein, was inzwischen zwei verschiedene Commits waren.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0). Created if it does not exist yet."
        required: true
        type: string
      ref:
        description: "Branch or commit to build from (empty = the tag itself)"
        required: false
        type: string
      prerelease:
        description: "Als Vorabversion kennzeichnen (zusaetzlich zur Erkennung an der Versionsnummer)"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0). Created if it does not exist yet."
        required: true
        type: string
      ref:
        description: "Branch or commit to build from (empty = the tag itself)"
        required: false
        type: string
      prerelease:
        description: "Als Vorabversion kennzeichnen"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

# Ein Release darf sich nicht selbst ueberholen. `cancel-in-progress: false`
# ist hier Absicht: einen halb veroeffentlichten Release abzubrechen waere
# schlimmer als zu warten.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. Pruefen, bevor irgendetwas gebaut oder veroeffentlicht wird.
  # -------------------------------------------------------------------------
  verify:
    name: Version und Tag pruefen
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      sha: ${{ steps.resolve.outputs.sha }}
      channel: ${{ steps.toolchain.outputs.channel }}
    steps:
      - name: Tag und Version bestimmen
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' ergibt keine gueltige Version (erwartet: v1.2.3)"
            exit 1
          fi
          # Vorabversion: entweder ausdruecklich angefordert, oder an der
          # Versionsnummer erkennbar. Frueher hing die Kennzeichnung allein an
          # `inputs.prerelease` - auf dem Tag-Weg ist dieser Wert leer, also
          # waere `v0.4.0-rc.1` als regulaerer Release erschienen. Das
          # Build-Metadatum (`+...`) macht keine Vorabversion, deshalb wird es
          # vorher abgeschnitten.
          CORE="${VERSION%%+*}"
          PRERELEASE="false"
          case "$CORE" in
            *-*) PRERELEASE="true" ;;
          esac
          if [ "${INPUT_PRERELEASE:-false}" = "true" ]; then
            PRERELEASE="true"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Release wird gebaut fuer tag=$TAG version=$VERSION prerelease=$PRERELEASE"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          # Fuer die Abstammungspruefung im naechsten Schritt wird die
          # Vorgeschichte gebraucht, nicht nur der Kopf.
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # Ab hier steht *eine* Commit-ID fest, und nur die wird weitergereicht.
      # Ein Branch- oder Tag-Name ist beweglich: `verify`, `ci`, `build` und
      # `release` haben ihn frueher jeweils selbst aufgeloest und konnten
      # damit auf verschiedenen Commits arbeiten.
      # ---------------------------------------------------------------------
      - name: Commit festnageln
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Gebaut und geprueft wird Commit $SHA"

      # Ohne diese Pruefung veroeffentlicht `git tag v0.3.1 <arbeitsstand> &&
      # git push --tags` ein oeffentliches Binary aus einem Arbeitsbranch.
      # publish-release.yml laesst nur den Default-Branch zu, der Tag-Weg
      # hierher (`on: push: tags`) und `workflow_dispatch` mit beliebigem
      # `ref` kannten dagegen gar keinen Branch.
      - name: Commit muss auf dem Default-Branch liegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::Default-Branch des Repositories nicht ermittelbar - Abbruch."
            exit 1
          fi
          git fetch --no-tags --quiet origin "$DEFAULT_BRANCH"
          # `git merge-base --is-ancestor` beantwortet die Frage mit dem
          # Rueckgabewert: 0 = ja, 1 = nein, alles andere = die Frage wurde
          # gar nicht beantwortet. Genau diese dritte Moeglichkeit ist der
          # Grund fuer das ausgeschriebene `case` statt eines `if ! ...`:
          # in diesem Repository hat schon einmal ein verschluckter
          # Rueckgabewert einen roten Zustand gruen aussehen lassen.
          set +e
          git merge-base --is-ancestor "$SHA" FETCH_HEAD
          RC=$?
          set -e
          case "$RC" in
            0)
              echo "$SHA liegt auf $DEFAULT_BRANCH - in Ordnung."
              ;;
            1)
              echo "::error::Commit $SHA liegt nicht auf dem Default-Branch ($DEFAULT_BRANCH). Ein Release entsteht nur aus Code, der dort angekommen ist. Erst zusammenfuehren, dann veroeffentlichen."
              exit 1
              ;;
            *)
              echo "::error::Die Abstammungspruefung konnte nicht durchgefuehrt werden (git merge-base endete mit $RC). Kein Ergebnis ist kein gruenes Licht - Abbruch."
              exit 1
              ;;
          esac

      - name: Rust-Channel aus rust-toolchain.toml lesen
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL="$(python3 - << 'PY'
          import sys, tomllib
          with open("rust-toolchain.toml", "rb") as fh:
              data = tomllib.load(fh)
          channel = data.get("toolchain", {}).get("channel")
          if not channel:
              sys.exit("rust-toolchain.toml: [toolchain] channel fehlt")
          print(channel)
          PY
          )"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Gepinnte Toolchain: $CHANNEL"

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Version gegen das Crate pruefen
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Bewusst ueber `cargo metadata` und nicht per grep/sed auf
          # Cargo.toml: die alte grep-Pruefung lieferte bei fehlgeschlagenem
          # sed die komplette Zeile zurueck statt zu scheitern, und sie sah
          # ohnehin nur das Workspace-Manifest, nicht das Crate, aus dem das
          # Binary entsteht.
          CRATE_VERSION="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -er '
                  [ .packages[] | select(.name == "redact-cli") | .version ]
                  | if length == 1 then .[0]
                    else error("redact-cli nicht eindeutig in cargo metadata gefunden")
                    end'
          )"
          echo "Tag        : $TAG"
          echo "redact-cli : $CRATE_VERSION"
          if [ "$VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag $TAG verlangt Version $VERSION, das Crate redact-cli meldet aber $CRATE_VERSION. Der Release wuerde ein Binary mit falscher Versionsangabe ausliefern."
            exit 1
          fi
          # .release-version ist der zweite Weg, einen Release auszuloesen.
          # Beide Angaben muessen dasselbe sagen, sonst haengt es davon ab,
          # welchen Weg jemand gerade genommen hat.
          if [ -f .release-version ]; then
            # Dieselbe Filterung wie in publish-release.yml: die Datei traegt
            # seit a2300bf einen Kommentarkopf, der erklaert, dass eine
            # Aenderung an ihr ein Release veroeffentlicht. `tr -d` allein
            # entfernt nur Leerraum und zog den ganzen Kommentar in die
            # Versionsnummer — dadurch scheiterte *jeder* Weg zur
            # Veroeffentlichung an diesem Schritt (belegt an Lauf
            # 30696875815 auf main).
            #
            # `grep` endet mit 1, wenn *keine* Zeile uebrig bleibt (Datei
            # enthaelt nur Kommentare) - unter `set -e` haette der Schritt
            # dann wortlos abgebrochen. Deshalb wird der Rueckgabewert hier
            # ausgewertet statt verschluckt: 0/1 sind Antworten, alles
            # darueber ist ein Fehler.
            set +e
            FILE_VERSION="$(grep -v '^[[:space:]]*#' .release-version)"
            RC=$?
            set -e
            if [ "$RC" -gt 1 ]; then
              echo "::error::.release-version konnte nicht gelesen werden (grep endete mit $RC)"
              exit 1
            fi
            FILE_VERSION="$(printf '%s' "$FILE_VERSION" | tr -d '[:space:]')"
            FILE_VERSION="${FILE_VERSION#v}"
            if [ -z "$FILE_VERSION" ]; then
              echo "::error::.release-version enthaelt keine Version (nur Kommentare oder Leerzeilen)"
              exit 1
            fi
            if [ "$FILE_VERSION" != "$CRATE_VERSION" ]; then
              echo "::error::.release-version ($FILE_VERSION) und redact-cli ($CRATE_VERSION) stimmen nicht ueberein"
              exit 1
            fi
          fi

      - name: Sicherstellen, dass nichts ueberschrieben wird
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # softprops/action-gh-release arbeitet als Upsert: ein zweiter Lauf
          # ersetzt die Assets eines bestehenden Releases. Da die Archive
          # frueher nicht reproduzierbar waren, aenderten sich damit die
          # Pruefsummen eines *bereits veroeffentlichten* Releases - Nutzer,
          # die ihre Downloads gegen SHA256SUMS pruefen, haetten das als
          # Manipulation gesehen. Deshalb hier hart abbrechen.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Fuer $TAG existiert bereits ein Release. Ein erneuter Lauf wuerde dessen Artefakte und Pruefsummen ersetzen. Wenn das gewollt ist: Release vorher manuell loeschen, sonst eine neue Version vergeben."
            exit 1
          fi
          # Auf dem Tag-Weg existiert der Tag naturgemaess schon. Auf dem
          # Datei-Weg legt ihn erst der Release an - existiert er dort
          # bereits, zeigt er moeglicherweise auf einen anderen Commit als
          # den, den wir gerade bauen.
          if [ "$REF_TYPE" != "tag" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
              echo "::error::Tag $TAG existiert bereits, soll auf diesem Weg aber erst angelegt werden. Bitte die Version erhoehen."
              exit 1
            fi
          fi
          echo "Weder Release noch (zu erzeugender) Tag vorhanden - in Ordnung."

  # -------------------------------------------------------------------------
  # 2. Die CI desselben Commits. Erst danach wird gebaut.
  #
  # Bewusst `uses: ./.github/workflows/ci.yml` statt einer Kopie der Schritte:
  # eine Kopie laeuft mit der Zeit auseinander, und dann prueft der Release
  # weniger als die CI, ohne dass es jemand merkt. So ist es dieselbe Datei -
  # fmt, clippy, Tests (Linux und Windows), MSRV und cargo-deny/cargo-audit.
  #
  # `needs: verify` ist Absicht: eine falsche Versionsnummer soll nicht erst
  # nach einem vollen CI-Durchlauf auffallen.
  #
  # Zwei Reste, die bewusst offen bleiben:
  #
  #  * Ein Job, den jemand in ci.yml per `if:` ueberspringen laesst, gilt als
  #    erfolgreich - das ist GitHubs Regel fuer uebersprungene Jobs und gilt
  #    fuer jede Form dieses Tors. Heute hat kein Job in ci.yml ein `if:`;
  #    wer eines einbaut, nimmt den Release-Schutz mit heraus.
  #  * Welche *Fassung* von ci.yml laeuft, entscheidet der Ref, auf dem der
  #    Workflow ausgeloest wurde - nicht `inputs.ref`. Bei einem Tag-Push und
  #    ueber publish-release.yml ist das derselbe Commit. Nur bei
  #    `workflow_dispatch` von einem Branch mit abweichendem `ref` koennen
  #    Pruefvorschrift und geprueftes Ziel auseinanderfallen; wer diesen Weg
  #    nimmt, loest ihn auf dem Default-Branch aus.
  # -------------------------------------------------------------------------
  ci:
    name: CI des Release-Commits
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}

  # -------------------------------------------------------------------------
  # 3. Bauen.
  # -------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.suffix }}
    needs: [verify, ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner-Images sind bewusst festgenagelt: `ubuntu-latest` und
          # `windows-latest` wandern und aendern damit Compiler-Umgebung,
          # Systembibliotheken und glibc-Anforderung unter uns weg.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: x86_64-windows
            bin: redact-rs.exe
            # Zweites Binary, nur unter Windows sinnvoll: dieselbe Oberflaeche
            # ohne das schwarze Konsolenfenster dahinter (Subsystem
            # "windows"). `redact-rs.exe` bleibt die Konsolenfassung.
            gui_bin: redact-rs-gui.exe
            ext: zip
            features: ""
            variant: "CLI + GUI"
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-linux
            bin: redact-rs
            ext: tar.gz
            features: ""
            variant: "CLI + GUI"
          # Statisch gegen musl gelinkte CLI ohne GUI. Der glibc-Build
          # verlangt eine glibc, die auf Debian 12, RHEL/Alma/Rocky 8 und 9
          # sowie Ubuntu 22.04 nicht vorhanden ist - also genau bei der
          # Zielgruppe (Behoerden, Kanzleien, Steuerberater). Dieses
          # Artefakt laeuft dort ohne Systemvoraussetzungen.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            suffix: x86_64-linux-musl
            bin: redact-rs
            ext: tar.gz
            features: "--no-default-features"
            variant: "nur CLI, statisch"
    steps:
      # Muss vor dem Checkout laufen: auf Windows-Runnern steht
      # core.autocrlf global auf true. Sonst landen README/LICENSE mit CRLF
      # im ZIP und mit LF im Tarball - und scripts/*.sh liessen sich unter
      # Git-Bash nicht ausfuehren.
      - name: Zeilenenden nicht umschreiben
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.sha }}

      # Nur der glibc-Build enthaelt die GUI (eframe/egui mit glow, x11,
      # wayland) und braucht dafuer Entwicklungspakete. libgtk-3-dev und
      # libssl-dev waren hier frueher gelistet, obwohl weder gtk/glib/cairo
      # noch openssl-sys im Abhaengigkeitsgraphen vorkommen - rfd 0.15 geht
      # ueber das XDG-Portal via D-Bus (ashpd/zbus).
      - name: Linux-Build-Abhaengigkeiten der GUI installieren
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: ${{ needs.verify.outputs.channel }}
          targets: ${{ matrix.target }}

      # Bewusst KEIN Swatinem/rust-cache in diesem Workflow: ein
      # veroeffentlichtes Artefakt soll aus einem sauberen Baum entstehen und
      # nicht aus einem Cache, den sich andere Laeufe und Branches teilen.
      # In ci.yml bleibt der Cache selbstverstaendlich erhalten.

      # Der Pfad des Build-Rechners gehoert nicht ins ausgelieferte Binary.
      # Gemessen an den Artefakten von v0.3.0: 178 Zeilen mit
      # `/home/runner/.cargo/registry/...` im musl-Binary, 575 im
      # glibc-Binary - die Ortsangaben, die `panic!` und `unwrap` mitbringen.
      # `strip = true` entfernt sie nicht, das sind keine Symbole. Sie machen
      # jeden Nachbau woanders zwangslaeufig verschieden, ohne dass sich an
      # der Software etwas geaendert haette.
      #
      # `--remap-path-prefix` ist die Fassung, die auf stabilem Rust
      # funktioniert. Die naheliegendere `[profile.release] trim-paths` ist
      # es NICHT: cargo 1.94.1 - die hier gepinnte Toolchain - lehnt sie ab
      # ("feature `trim-paths` is required ... not stabilized in this version
      # of Cargo"). Sobald sie stabil ist, gehoert sie nach Cargo.toml und
      # diese Zeilen koennen weg - `trim-paths` deckt beide Faelle mit ab.
      #
      # ZWEI Prefixe, nicht einer. Der erste erfasst den uebersetzten
      # Quelltext aller Crates aus der Registry. Er erfasst NICHT, was ein
      # Build-Skript zur Bauzeit nach `OUT_DIR` schreibt und die Kiste per
      # `include!(concat!(env!("OUT_DIR"), …))` einzieht - dieser Pfad liegt
      # unterhalb des Target-Verzeichnisses und ist absolut. Im
      # glibc-Artefakt von v0.4.0 und v0.5.0 blieben dadurch drei Pfade des
      # Build-Rechners stehen:
      #
      #   …/target/x86_64-unknown-linux-gnu/release/build/glutin_egl_sys-…/out/egl_bindings.rs
      #   …/glutin_glx_sys-…/out/glx_bindings.rs
      #   …/glutin_glx_sys-…/out/glx_extra_bindings.rs
      #
      # (musl und Windows sind davon nicht betroffen: musl baut ohne
      # Oberflaeche, Windows ohne die X11-/EGL-Anbindung.)
      #
      # NACHGEMESSEN, bevor diese Zeile hier stand - mit einem auffaelligen
      # Ersatzpfad, damit das Ergebnis nicht zu verwechseln ist:
      #
      #   RUSTFLAGS="… --remap-path-prefix=$PWD/target=/ZWEITER-PREFIX" \
      #     cargo build --release --locked -p redact-cli
      #   strings -a target/release/redact-rs | grep -c /home/user/redactrs   -> 0
      #   strings -a target/release/redact-rs | grep ZWEITER-PREFIX
      #     /ZWEITER-PREFIX/release/build/glutin_egl_sys-…/out/egl_bindings.rs
      #     /ZWEITER-PREFIX/release/build/glutin_glx_sys-…/out/glx_bindings.rs
      #     /ZWEITER-PREFIX/release/build/glutin_glx_sys-…/out/glx_extra_bindings.rs
      #
      # Vorher standen dort dieselben drei Zeilen mit dem echten Pfad.
      #
      # `${CARGO_TARGET_DIR:-$PWD/target}`, weil cargo genau so entscheidet.
      # Der Schritt laeuft ohne `working-directory`, also ist `$PWD` die Wurzel
      # des Arbeitsbaums.
      #
      # Vorsicht beim Aendern: `RUSTFLAGS` in der Umgebung *ersetzt*
      # `target.<triple>.rustflags` aus .cargo/config.toml, es wird nicht
      # zusammengefuegt. Fuer die drei Targets dieser Matrix (msvc,
      # linux-gnu, linux-musl) gibt es dort keinen solchen Abschnitt; wer
      # einen anlegt, muss ihn hier beruecksichtigen.
      - name: redact-rs bauen
        shell: bash
        run: |
          set -euo pipefail
          CARGO_HOME_DIR="${CARGO_HOME:-$HOME/.cargo}"
          TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/target}"
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME_DIR}/registry/src=/cargo-registry --remap-path-prefix=${TARGET_DIR}=/cargo-target"
          echo "RUSTFLAGS=$RUSTFLAGS"
          cargo build --release --locked \
            --target "${{ matrix.target }}" \
            -p redact-cli ${{ matrix.features }}

      - name: Paketinhalt zusammenstellen
        id: stage
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
          GUI_BIN: ${{ matrix.gui_bin }}
          SUFFIX: ${{ matrix.suffix }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          ARCHIVE="redact-rs-${VERSION}-${SUFFIX}.${EXT}"
          rm -rf staging
          mkdir -p staging
          cp "target/${TARGET}/release/${BIN}" staging/
          # Fensterfassung, wo die Matrix eine vorsieht (derzeit nur Windows).
          # Fehlt sie dort, ist der Build kaputt - dann abbrechen statt ein
          # unvollstaendiges Archiv zu veroeffentlichen.
          if [ -n "${GUI_BIN}" ]; then
            if [ ! -f "target/${TARGET}/release/${GUI_BIN}" ]; then
              echo "::error::${GUI_BIN} wurde nicht gebaut"
              exit 1
            fi
            cp "target/${TARGET}/release/${GUI_BIN}" staging/
          fi
          # SECURITY.md gehoert dazu: die README verweist neunmal darauf
          # (Grenzen, Bedrohungsmodell, Schreibpfad). Wer nur das Archiv hat,
          # lief bisher in tote Verweise. CHANGELOG.md aus demselben Grund:
          # wer eine aeltere Fassung ersetzt, muss ohne Netzzugang sehen
          # koennen, welche Lecks dazwischen geschlossen wurden.
          for f in README.md SECURITY.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE LICENSE; do
            if [ -f "$f" ]; then cp "$f" staging/; fi
          done
          # SIL Open Font License 1.1. Die egui-Standardschriften
          # (epaint_default_fonts) sind im GUI-Binary eingebettet, und
          # crates/redact-render bringt eigene OFL-Schriften mit. Die OFL
          # verlangt, dass ihr Text mitgeliefert wird - deshalb liegt er
          # jedem Archiv bei, auch dem reinen CLI-Archiv.
          OFL="crates/redact-render/assets/fonts/LICENSE-OFL.txt"
          if [ -f "$OFL" ]; then
            cp "$OFL" staging/LICENSE-OFL.txt
          else
            echo "::error::$OFL fehlt - die Schriftlizenz muss mit ausgeliefert werden"
            exit 1
          fi
          if [ -d examples ]; then
            cp -r examples staging/examples
          else
            echo "::warning::kein Verzeichnis examples/ gefunden - das Archiv enthaelt keine Beispiele"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          ls -la staging

      - name: Reproduzierbares Archiv erzeugen
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/make-archive.sh staging "$ARCHIVE"

      # Wozu diese Summe taugt - und wozu nicht.
      #
      # Sie bezeugt: diese Datei ist genau die, die aus diesem Lauf kam,
      # unabhaengig davon, wie sie verpackt wurde. Wer ein Archiv entpackt,
      # kann das Binary daran pruefen.
      #
      # Hier stand vorher: "Wer nachbauen will, vergleicht diesen Hash." Das
      # war eine Zusage, die der Bau nicht einloest, und sie ist nachgemessen
      # falsch gewesen: die v0.3.0-Artefakte tragen 178 (musl) bzw. 575
      # (glibc) Zeilen mit `/home/runner/.cargo/registry/...` in sich, ein
      # Nachbau anderswo entsprechend seine eigenen. Gleiche Crate-Versionen,
      # gleiche Dateinamen - nur das Heimatverzeichnis des Build-Rechners
      # unterscheidet sich. Nachzaehlen:
      #
      #   strings -a redact-rs | grep -c '/\.cargo/registry/'
      #
      # Der Bau-Schritt oben nimmt diesen Unterschied jetzt heraus. Gemessen
      # mit Toolchain 1.94.1 und `-p redact-cli --no-default-features`, je
      # zwei Baeume an verschiedenen Pfaden und mit verschiedenem CARGO_HOME:
      #
      #   ohne Umschreibung  x86_64-unknown-linux-gnu   verschieden
      #                      (4 844 184 gegen 4 858 072 Byte, 177 fremde
      #                       Registry-Pfade im zweiten Binary)
      #   mit Umschreibung   x86_64-unknown-linux-gnu   bitgleich
      #   mit Umschreibung   x86_64-unknown-linux-musl  bitgleich
      #
      # Was damit NICHT gezeigt ist: dass ein *anderer* Rechner dasselbe
      # ergibt. Gemessen wurde auf einer Maschine; der glibc-Build linkt
      # ausserdem mit dem System-Linker des Runners, und der gehoert nicht zur
      # gepinnten Toolchain. Solange das niemand nachgemessen hat, verspricht
      # diese Datei Herkunft, nicht Nachbaubarkeit.
      - name: Pruefsumme des rohen Binaries
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
          GUI_BIN: ${{ matrix.gui_bin }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          : > "binhash-${SUFFIX}.txt"
          for b in "${BIN}" ${GUI_BIN:+"${GUI_BIN}"}; do
            HASH="$(sha256sum "staging/${b}" | cut -d' ' -f1)"
            printf '%s  %s/%s\n' "$HASH" "$SUFFIX" "$b" >> "binhash-${SUFFIX}.txt"
          done
          cat "binhash-${SUFFIX}.txt"

      # Die tatsaechlich benoetigte glibc aus dem gebauten Binary ablesen,
      # statt sie in den Release-Notizen zu behaupten.
      - name: Benoetigte glibc ermitteln
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          GLIBC_MIN="$(
            objdump -T "target/${TARGET}/release/${BIN}" \
              | sed -nE 's/.*GLIBC_([0-9]+(\.[0-9]+)+).*/\1/p' \
              | sort -V | tail -n1
          )"
          if [ -z "$GLIBC_MIN" ]; then
            echo "::warning::konnte die benoetigte glibc-Version nicht ermitteln"
            GLIBC_MIN="unbekannt"
          fi
          echo "$GLIBC_MIN" > glibc-min.txt
          echo "benoetigte glibc: $GLIBC_MIN"

      - name: Artefakte hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.suffix }}
          path: |
            ${{ env.ARCHIVE }}
            binhash-${{ matrix.suffix }}.txt
            glibc-min.txt
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 4. Veroeffentlichen.
  # -------------------------------------------------------------------------
  release:
    name: GitHub Release veroeffentlichen
    needs: [verify, ci, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Fuer actions/attest-build-provenance: OIDC-Token zum Signieren und
      # das Recht, die Attestierung am Repository zu hinterlegen.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Build-Artefakte herunterladen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Pruefsummen erzeugen
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -la
          shopt -s nullglob
          archives=(redact-rs-*)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::es wurden keine Release-Archive heruntergeladen"
            exit 1
          fi
          # LC_ALL=C, damit die Reihenfolge der Zeilen nicht von der Locale
          # des Runners abhaengt - sonst sieht SHA256SUMS je nach Image
          # anders aus, obwohl sich nichts geaendert hat.
          mapfile -t archives < <(printf '%s\n' "${archives[@]}" | LC_ALL=C sort)
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

          binhashes=(binhash-*.txt)
          if [ ${#binhashes[@]} -eq 0 ]; then
            echo "::error::keine Binary-Pruefsummen gefunden"
            exit 1
          fi
          LC_ALL=C sort -k2 -- "${binhashes[@]}" > SHA256SUMS-BINARIES
          cat SHA256SUMS-BINARIES

      # Signierte SLSA-Herkunftsaussage: bindet jedes Archiv an dieses
      # Repository, diesen Workflow und diesen Commit. Damit laesst sich von
      # aussen pruefen, dass eine Datei wirklich aus diesem Build stammt -
      # unabhaengig davon, wer Schreibrechte auf Releases hat.
      #
      # NUR FUER OEFFENTLICHE REPOSITORIES. GitHub lehnt das Speichern der
      # Aussage in einem privaten Repository unter einem Benutzerkonto ab:
      # "Failed to persist attestation: Feature not available for user-owned
      # private repositories." Der Schritt ist deshalb an `private == false`
      # gebunden. Bewusst NICHT `continue-on-error`: ein Fehlschlag beim
      # Signieren eines oeffentlichen Releases soll den Lauf stoppen, nicht
      # stillschweigend eine Zusage streichen.
      - name: Provenienz erzeugen
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/redact-rs-*'

      - name: Fehlende Provenienz vermerken
        if: ${{ github.event.repository.private }}
        shell: bash
        run: |
          echo "::warning::Dieses Repository ist privat - GitHub erzeugt dafuer" \
               "keine Herkunftsaussage. Die Release-Notizen weisen darauf hin;" \
               "die SHA-256-Summen bleiben die Pruefgrundlage."

      - name: Release-Notizen erzeugen
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          # Entscheidet, ob die Notizen eine Herkunftsaussage versprechen
          # duerfen - GitHub erzeugt sie fuer private Repositories unter
          # einem Benutzerkonto nicht.
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          GLIBC_MIN="unbekannt"
          if [ -f dist/glibc-min.txt ]; then
            GLIBC_MIN="$(tr -d '[:space:]' < dist/glibc-min.txt)"
          fi
          # Den Abschnitt dieser Version aus CHANGELOG.md holen, statt die
          # Verhaltensaenderungen wieder nur in `git log` stehen zu lassen.
          # Bis v0.3.0 enthielten diese Notizen Artefakttabelle, Pruefsummen
          # und Herkunftshinweis - und keine einzige Verhaltensaenderung.
          #
          # Ist der Abschnitt laenger als NOTES_MAX Zeichen, wird nur sein
          # VORSPANN genommen - bis zur ersten `### `-Zeile. Der Abschnitt
          # von 0.7.0 traegt darunter den Verlauf aller Pruefrunden, zusammen
          # rund 150 000 Zeichen; GitHub nimmt als Release-Text hoechstens
          # 125 000 und lehnte die Veroeffentlichung sonst ab. Der Vorspann
          # fasst den Abschnitt zusammen, der Link darunter fuehrt zum
          # vollstaendigen Verlauf.
          NOTES_MAX=100000
          abschnitt() {
            awk -v v="$VERSION" -v nur_vorspann="$1" '
              BEGIN { esc = v; gsub(/\./, "\\.", esc); pat = "^## " esc "([^0-9.]|$)" }
              $0 ~ pat { inside = 1; next }
              inside && /^## / { exit }
              inside && nur_vorspann && /^### / { exit }
              inside && /^---[[:space:]]*$/ { next }
              inside { print }
            ' CHANGELOG.md
          }
          CHANGES=""
          if [ -f CHANGELOG.md ]; then
            CHANGES="$(abschnitt 0)"
            if [ "$(printf '%s' "$CHANGES" | wc -m)" -gt "$NOTES_MAX" ]; then
              echo "::notice::Der Abschnitt ${VERSION} ist laenger als ${NOTES_MAX} Zeichen - die Release-Notizen nehmen nur seinen Vorspann."
              CHANGES="$(abschnitt 1)"
            fi
            # Fuehrende und abschliessende Leerzeilen weg.
            CHANGES="$(printf '%s\n' "$CHANGES" | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')"
          fi
          if [ -z "$CHANGES" ]; then
            echo "::warning::CHANGELOG.md hat keinen Abschnitt fuer ${VERSION} - die Release-Notizen nennen deshalb keine Verhaltensaenderungen."
          fi
          {
            echo "## redact-rs ${VERSION}"
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "> **Vorabversion.** Diese Fassung ist als Vorabversion"
              echo "> gekennzeichnet - entweder weil die Versionsnummer eine"
              echo "> ist (\`0.4.0-rc.1\`) oder weil der Release ausdruecklich"
              echo "> so angefordert wurde."
              echo
            fi
            echo "Vorkompilierte Binaries von \`redact-rs\` (Tag \`${TAG}\`)."
            echo
            echo "### Was sich geaendert hat"
            echo
            if [ -n "$CHANGES" ]; then
              printf '%s\n' "$CHANGES"
            else
              echo "Fuer diese Fassung steht im Aenderungsverlauf kein Abschnitt."
            fi
            echo
            echo "Der vollstaendige Verlauf:"
            echo "[\`CHANGELOG.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
            echo
            echo "### Artefakte"
            echo
            echo "| Datei | Plattform | Inhalt |"
            echo "| --- | --- | --- |"
            echo "| \`redact-rs-${VERSION}-x86_64-windows.zip\` | Windows x86_64 (MSVC) | \`redact-rs.exe\` (Konsole) + \`redact-rs-gui.exe\` (Fenster) |"
            echo "| \`redact-rs-${VERSION}-x86_64-linux.tar.gz\` | Linux x86_64, glibc >= ${GLIBC_MIN} | CLI + GUI |"
            echo "| \`redact-rs-${VERSION}-x86_64-linux-musl.tar.gz\` | Linux x86_64, statisch (musl) | nur CLI |"
            echo "| \`SHA256SUMS\` | | Pruefsummen der Archive |"
            echo "| \`SHA256SUMS-BINARIES\` | | Pruefsummen der entpackten Binaries |"
            echo
            echo "### Windows: zwei Programme, eine Anwendung"
            echo
            echo "\`redact-rs-gui.exe\` ist die zum Doppelklicken - sie oeffnet"
            echo "nur das Fenster, ohne die schwarze Konsole dahinter, und"
            echo "nimmt ein PDF entgegen, das man auf ihr Symbol zieht."
            echo "\`redact-rs.exe\` ist die Konsolenfassung mit allen Optionen"
            echo "und der einzige Weg zu Ausgaben auf stdout."
            echo
            echo "### Welches Archiv?"
            echo
            echo "Das glibc-Archiv setzt **glibc ${GLIBC_MIN} oder neuer** voraus."
            echo "Aeltere, aber verbreitete Systeme - Debian 12, RHEL/Alma/Rocky 8"
            echo "und 9, Ubuntu 22.04 - erfuellen das nicht. Dort das"
            echo "**musl-Archiv** verwenden: statisch gelinkt, ohne"
            echo "Systemvoraussetzungen, dafuer ohne grafische Oberflaeche."
            echo
            echo "### SHA-256"
            echo
            echo "Archive:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Entpackte Binaries (unabhaengig von der Verpackung):"
            echo
            echo '```'
            cat dist/SHA256SUMS-BINARIES
            echo '```'
            echo
            echo "Pruefen mit \`sha256sum -c SHA256SUMS\` (Linux) bzw."
            echo "\`Get-FileHash <datei> -Algorithm SHA256\` (PowerShell)."
            echo
            echo "**Was diese Summen belegen - und was nicht.** Sie zeigen,"
            echo "dass eine heruntergeladene Datei unveraendert die ist, die"
            echo "aus diesem Lauf kam. Sie sind **keine** Zusage, dass ein"
            echo "eigener Nachbau dieselbe Summe ergibt: gebaut wird mit der"
            echo "in \`rust-toolchain.toml\` gepinnten Toolchain und dem"
            echo "\`Cargo.lock\` dieses Commits, aber ob ein anderer Rechner"
            echo "daraus dasselbe Byte-fuer-Byte-Ergebnis erzeugt, ist nicht"
            echo "nachgemessen. Wer die Herkunft pruefen will, nimmt die"
            echo "Signatur unten, nicht einen Nachbau."
            echo
            echo "### Herkunft pruefen"
            echo
            if [ "${IS_PRIVATE}" = "true" ]; then
              # Nichts versprechen, was nicht da ist: GitHub erzeugt fuer
              # private Repositories unter einem Benutzerkonto keine
              # Herkunftsaussage.
              echo "**Zu diesem Release gibt es keine Herkunftsaussage.**"
              echo "GitHub bietet die Signatur fuer private Repositories unter"
              echo "einem Benutzerkonto nicht an. Pruefgrundlage sind hier"
              echo "allein die SHA-256-Summen oben. Wird das Repository"
              echo "oeffentlich, erzeugt derselbe Workflow die Aussage"
              echo "automatisch mit."
            else
              echo "Zu jedem Archiv gibt es eine signierte SLSA-Herkunftsaussage."
              echo "Damit laesst sich nachweisen, dass die Datei aus diesem"
              echo "Repository und diesem Workflow stammt:"
              echo
              echo '```bash'
              echo "gh attestation verify redact-rs-${VERSION}-x86_64-linux.tar.gz \\"
              echo "  --repo ${GITHUB_REPOSITORY}"
              echo '```'
            fi
          } > release-notes.md
          cat release-notes.md
          # Lieber hier mit Begruendung abbrechen als beim Hochladen mit einer
          # Fehlermeldung von GitHub, nachdem alle Archive gebaut sind.
          ZEICHEN="$(wc -m < release-notes.md)"
          if [ "$ZEICHEN" -gt 120000 ]; then
            echo "::error::Die Release-Notizen haben ${ZEICHEN} Zeichen; GitHub nimmt hoechstens 125000. Den Vorspann des Abschnitts in CHANGELOG.md kuerzen."
            exit 1
          fi

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          # Die in `verify` festgenagelte Commit-ID, nicht ein Branch-Name:
          # auf dem Datei-Weg legt dieser Schritt den Tag an, und der muss
          # genau an dem Commit haengen, der geprueft und gebaut wurde.
          target_commitish: ${{ needs.verify.outputs.sha }}
          name: redact-rs ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/redact-rs-*
            dist/SHA256SUMS
            dist/SHA256SUMS-BINARIES
