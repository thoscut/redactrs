name: Publish Release

# Veroeffentlicht einen Release, sobald sich die Datei `.release-version`
# aendert. Der Tag wird dabei vom Release selbst am gebauten Commit angelegt.
#
# Warum nicht einfach einen Tag pushen? In abgeschotteten Umgebungen (CI-Bots,
# Sandboxes) darf oft nur auf einen bestimmten Branch gepusht werden, und das
# Ausloesen von workflow_dispatch ueber die API ist gesperrt. Eine
# Versionsdatei im Repository ist der eine Weg, der immer funktioniert - und
# gleichzeitig ein gut nachvollziehbarer Ablauf: die Version steht versioniert
# im Repository, der Release folgt daraus.
#
# Ablauf:
#   1. `.release-version` auf die gewuenschte Version setzen (z.B. 0.2.0)
#   2. committen und pushen
#   3. dieser Workflow baut Windows- und Linux-Binaries und veroeffentlicht sie
#
# WELCHE BRANCHES DAS DUERFEN
# Frueher stand hier `branches: ["**"]`. Damit legte *jeder* Push auf
# *irgendeinen* Branch, der .release-version beruehrt, einen Tag an und
# veroeffentlichte einen oeffentlichen Release - auch aus einem Arbeitsbranch
# mit halbfertigem Stand.
#
# Danach stand hier zusaetzlich `claude/**`, weil der Arbeitsbranch der
# Sandbox damals selbst der Default-Branch war und es sonst gar keinen Weg
# zu einem regulaeren Release gegeben haette.
#
# BEIDES IST VORBEI, und der Eintrag war nicht nur ueberfluessig, sondern
# schaedlich: v0.3.0 wurde auf denselben Commit zweimal ausgeloest - einmal
# ueber den Arbeitsbranch, einmal ueber `main`. Der Lauf des Arbeitsbranches
# war 14 Sekunden schneller, hat den Release als *Vorabversion* angelegt
# (er ist ja nicht der Default-Branch), und der Lauf von `main` scheiterte
# danach am bereits vorhandenen Tag. Ein Wettlauf, den man nicht sieht,
# solange man nicht beide Laeufe nebeneinander legt.
#
# Es bleibt deshalb der Default-Branch, und nur er. Der `branches`-Filter
# ist die erste Schranke; die `if`-Bedingungen an den Jobs sind die zweite
# und pruefen gegen den *tatsaechlichen* Default-Branch des Repositories
# (der Filter kann das nicht, er kennt nur Namen).
#
# Das galt lueckenlos nur fuer *diesen* Weg. `release.yml` liess sich
# daneben per Tag-Push (`on: push: tags: v*`) oder `workflow_dispatch` mit
# beliebigem `ref` von jedem Arbeitsstand aus ausloesen und kannte dabei gar
# keinen Branch. Seit `verify` dort die Abstammung vom Default-Branch prueft,
# gilt die Regel fuer alle Wege - nicht nur fuer den bequemsten.

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".release-version"

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version einlesen
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Version aus .release-version lesen
        id: read
        shell: bash
        run: |
          set -euo pipefail
          # Kommentarzeilen (`#`) und Leerzeilen werden verworfen, damit in
          # der Datei stehen darf, was sie auslöst - sie veroeffentlicht ein
          # Release, und das sollte man ihr ansehen. Frueher wurde die ganze
          # Datei zur Version verdichtet; ein erklaerender Satz darin haette
          # eine unsinnige Version ergeben.
          #
          # Der Rueckgabewert von `grep` wird ausgewertet und nicht
          # verschluckt: bleibt keine Zeile uebrig (die Datei enthaelt nur
          # noch Kommentare), endet `grep` mit 1, und unter `set -e` waere
          # der Schritt an dieser Stelle *wortlos* gestorben - die
          # freundliche Meldung darunter war unerreichbar. 0 und 1 sind
          # Antworten, alles darueber ist ein Fehler.
          set +e
          VERSION="$(grep -v '^[[:space:]]*#' .release-version)"
          RC=$?
          set -e
          if [ "$RC" -gt 1 ]; then
            echo "::error::.release-version konnte nicht gelesen werden (grep endete mit $RC)"
            exit 1
          fi
          VERSION="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "::error::.release-version enthaelt keine Version (nur Kommentare oder Leerzeilen)"
            exit 1
          fi
          # Fuehrendes "v" tolerieren, aber intern immer ohne fuehrendes v rechnen.
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' ist keine gueltige Version (erwartet: 1.2.3)"
            exit 1
          fi
          # Der Abgleich mit der Version des Crates passiert im Job `verify`
          # von release.yml ueber `cargo metadata`. Die frueher hier
          # stehende grep/sed-Pruefung auf Cargo.toml lieferte bei
          # fehlgeschlagenem sed die komplette Zeile zurueck statt zu
          # scheitern - und sah nur das Workspace-Manifest, nicht das Crate,
          # aus dem das Binary entsteht.
          #
          # Hier stand bis eben ein Zweig, der einen Release aus einem
          # anderen Branch als dem Default-Branch als Vorabversion
          # gekennzeichnet haette. Seit 04da92c laeuft dieser Job nur noch
          # auf dem Default-Branch (`branches`-Filter *und* `if:` an beiden
          # Jobs) - der Zweig konnte also nicht mehr greifen. Toter Code in
          # einem Ablauf, der oeffentliche Binaries erzeugt, liest sich wie
          # eine vorhandene Schranke; deshalb ist er weg. Ob eine Fassung
          # eine Vorabversion ist, entscheidet jetzt `verify` in release.yml
          # an der Versionsnummer (`0.4.0-rc.1`).
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release wird gebaut fuer v$VERSION"

  release:
    name: Bauen und veroeffentlichen
    needs: version
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ github.sha }}
