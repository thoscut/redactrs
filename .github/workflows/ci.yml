name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Eine Stelle, an der die Toolchain-Version herkommt: rust-toolchain.toml.
  # Alle folgenden Jobs bekommen sie von hier, damit CI und lokaler Build
  # nicht auseinanderlaufen koennen.
  # -------------------------------------------------------------------------
  toolchain:
    name: Toolchain bestimmen
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.read.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rust-Channel aus rust-toolchain.toml lesen
        id: read
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL="$(python3 - << 'PY'
          import sys, tomllib
          with open("rust-toolchain.toml", "rb") as fh:
              data = tomllib.load(fh)
          channel = data.get("toolchain", {}).get("channel")
          if not channel:
              sys.exit("rust-toolchain.toml: [toolchain] channel fehlt")
          print(channel)
          PY
          )"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Gepinnte Toolchain: $CHANNEL"

  test:
    name: Test / Lint (ubuntu-24.04)
    needs: toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # eframe/egui (glow + x11 + wayland) brauchen unter Linux ein paar
      # Entwicklungspakete; das meiste wird zur Laufzeit per dlopen geladen.
      #
      # libgtk-3-dev und libssl-dev standen hier frueher mit drin, obwohl
      # weder gtk/glib/cairo noch openssl-sys im Abhaengigkeitsgraphen
      # vorkommen: rfd 0.15 spricht den XDG-Portal ueber D-Bus an
      # (ashpd/zbus). Nachgeprueft mit einem vollstaendigen Build der GUI
      # ohne diese Pakete.
      - name: Linux-Build-Abhaengigkeiten der GUI installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  build-windows:
    name: Build (windows-2025)
    needs: toolchain
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      # Volle Feature-Menge inkl. GUI: unter MSVC bringen eframe/egui/rfd
      # ihre Windows-Abhaengigkeiten selbst mit, es sind keine Systempakete
      # noetig.
      - name: Build redact-rs (release)
        run: cargo build --release --locked -p redact-cli

      - name: Test
        run: cargo test --workspace --locked

      - name: Upload redact-rs.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redact-rs-windows-x86_64
          path: target/release/redact-rs.exe
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------
  # MSRV: prueft, ob die in Cargo.toml zugesagte aelteste Rust-Version
  # tatsaechlich reicht.
  #
  # Sie reichte lange nicht. Der Job war als `continue-on-error` angelegt,
  # weil `rust-version = "1.75"` schlicht nicht stimmte - eine Zusage, die
  # nie jemand nachgemessen hatte:
  #
  #   * clap_lex verwendet edition2024 und braucht cargo >= 1.85
  #   * time 0.3.54 (ueber lopdf) und image (ueber eframe) deklarieren 1.88
  #
  # Nachgemessen mit einer echten 1.88.0-Toolchain auf frischem Baum:
  # `cargo check --workspace --locked` laeuft durch. 1.88.0 ist auch die
  # exakte Untergrenze - cargo bricht ab, sobald eine Abhaengigkeit eine
  # hoehere `rust-version` deklariert als die verwendete Toolchain.
  #
  # `continue-on-error` ist deshalb entfernt: der Job ist jetzt eine
  # Zusicherung und kein Hinweis mehr. Steigt eine Abhaengigkeit weiter,
  # wird er rot - dann gehoert der Wert in Cargo.toml angehoben, nicht
  # dieser Job abgeschaltet.
  # -------------------------------------------------------------------------
  msrv:
    name: MSRV (rust-version aus Cargo.toml)
    needs: toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rust-Toolchain installieren (zum Auslesen der Metadaten)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}

      - name: Zugesagte MSRV auslesen
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          MSRV="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -er '
                  [ .packages[] | select(.name == "redact-cli") | .rust_version ]
                  | if length == 1 and .[0] != null then .[0]
                    else error("rust-version von redact-cli nicht gefunden")
                    end'
          )"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
          echo "Zugesagte MSRV: $MSRV"

      - name: MSRV-Toolchain installieren
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      # RUSTUP_TOOLCHAIN steht in rustups Rangfolge ueber rust-toolchain.toml
      # - nur so laesst sich hier gezielt gegen die MSRV bauen, ohne die
      # Pinnung fuer alle anderen Jobs auszuhebeln.
      - name: cargo check mit der MSRV-Toolchain
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          rustc --version
          cargo check --workspace --locked

  # -------------------------------------------------------------------------
  # Lieferkette: bekannte Schwachstellen, Lizenzen, Bezugsquellen.
  # -------------------------------------------------------------------------
  supply-chain:
    name: cargo-deny / cargo-audit
    needs: toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}

      # cache-bin ist in rust-cache standardmaessig an, damit werden die
      # gebauten Werkzeuge in ~/.cargo/bin mitgecacht.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: supply-chain

      # Feste Versionen: sonst aendert sich mit jedem Lauf, was geprueft wird
      # - und deny.toml ist auf das Schema von cargo-deny 0.20.x geschrieben.
      - name: cargo-deny und cargo-audit installieren
        run: |
          set -euo pipefail
          # `cargo install` mit fester Version ist ein No-op, wenn genau
          # diese Version schon (aus dem Cache) daliegt, und ersetzt sie
          # sonst. Kein `command -v`-Kurzschluss, der eine veraltete
          # Version aus dem Cache stehen liesse.
          cargo install --locked cargo-deny@0.20.2
          cargo install --locked cargo-audit@0.22.2
          cargo deny --version
          cargo audit --version

      # Welche Targets und Features geprueft werden, steht in deny.toml
      # ([graph]) - nicht hier, damit lokale Laeufe dasselbe pruefen.
      - name: cargo deny
        run: cargo deny check advisories licenses bans sources

      # cargo-audit liest deny.toml nicht; die befristete Ausnahme muss
      # deshalb hier ein zweites Mal stehen. Begruendung und Frist stehen
      # bei genau einem Eintrag in deny.toml - beim lopdf-Update auf >= 0.42
      # gehoeren beide Stellen weg.
      #
      # Bewusst ohne `--deny warnings`: `cargo audit` meldet aktuell zwei
      # transitiv eingeschleppte, nicht mehr gepflegte Crates
      # (RUSTSEC-2024-0436 paste 1.0.15, RUSTSEC-2026-0192 ttf-parser
      # 0.25.1). Beides sind keine Schwachstellen, und beides koennen wir
      # nicht selbst aufloesen - mit `--deny warnings` waere die CI nur
      # dauerhaft rot. Die Meldungen erscheinen weiterhin im Protokoll.
      # Echte Schwachstellen lassen `cargo audit` ohnehin fehlschlagen.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0187
