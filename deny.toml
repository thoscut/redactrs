# cargo-deny Konfiguration fuer redact-rs.
#
# Geprueft wird in CI (siehe .github/workflows/ci.yml, Job "supply-chain"):
#   cargo deny check advisories licenses bans sources
#
# Lokal identisch:
#   cargo install --locked cargo-deny
#   cargo deny check
#
# Hinweis zur Schema-Version: diese Datei ist fuer cargo-deny 0.20.x
# geschrieben (dort sind die frueheren `version = 2`-Schluessel unter
# [advisories]/[licenses] entfallen). Die CI installiert deshalb eine
# festgelegte Version.

[graph]
# Nur die Ziele pruefen, die wir auch ausliefern. Ohne diese Liste wuerde
# cargo-deny auch Abhaengigkeiten fuer z.B. wasm/redox melden, die nie
# gebaut werden.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Optionale Features (pdfium) sind nicht Teil der Release-Artefakte.
all-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Sicherheitsmeldungen (RustSec)
# ---------------------------------------------------------------------------
[advisories]
# Zurueckgezogene ("yanked") Crate-Versionen sind ein Fehler, kein Hinweis.
yanked = "deny"
unmaintained = "workspace"

# Keine Ausnahmen. Eine Meldung, die hier steht, ist eine Meldung, die
# niemand mehr liest - deshalb bleibt die Liste leer, solange es geht.
ignore = []

# ---------------------------------------------------------------------------
# Lizenzen
# ---------------------------------------------------------------------------
[licenses]
# Alles, was im Abhaengigkeitsgraphen tatsaechlich vorkommt (ermittelt ueber
# `cargo metadata`), und nichts darueber hinaus. Neue Lizenzen sollen
# auffallen, nicht durchrutschen.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    # SIL Open Font License 1.1 - gilt fuer die mitgelieferten Schriften in
    # crates/redact-render/assets/fonts/ und fuer die Standardschriften in
    # epaint_default_fonts. Die OFL verlangt, dass ihr Text mitgeliefert
    # wird; die Release-Workflows legen LICENSE-OFL.txt deshalb ins Archiv.
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# `r-efi` ist "MIT OR Apache-2.0 OR LGPL-2.1-or-later" - die ODER-Verknuepfung
# ist ueber MIT erfuellt, LGPL wird bewusst *nicht* erlaubt.

[[licenses.exceptions]]
# epaint_default_fonts ist "(MIT OR Apache-2.0) AND OFL-1.1 AND
# LicenseRef-UFL-1.0". Die Ubuntu Font Licence gilt nur fuer dieses eine
# Crate (Ubuntu-Light in den egui-Standardschriften) und wird deshalb nicht
# global erlaubt.
name = "epaint_default_fonts"
allow = ["LicenseRef-UFL-1.0"]

# ---------------------------------------------------------------------------
# Doppelte Versionen
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
# Hier stand "warn", weil die versionslosen Pfad-Abhaengigkeiten des
# Workspace (redact-core & Co.) als Wildcards zaehlten. Das ist behoben:
# `publish = false` steht jetzt in [workspace.package] der Wurzel und wird
# von allen acht Crates geerbt, `allow-wildcard-paths` greift damit.
#
# EINE KORREKTUR ZUR FRUEHEREN NOTIZ AN DIESER STELLE: sie sagte, mit
# `publish = false` koenne `allow-wildcard-paths` *entfallen*. Das stimmt
# nicht. Der Schluessel ist nicht die Bedingung, sondern der Schalter, der
# die Ausnahme ueberhaupt erlaubt; `publish = false` macht die Crates nur
# erst dazu berechtigt. Nachgemessen mit cargo-deny 0.20.2:
#
#   publish = true  + allow-wildcard-paths = true   -> bans FAILED
#   publish = false + allow-wildcard-paths = true   -> bans ok
#   publish = false ohne allow-wildcard-paths       -> bans FAILED
#
# Beide Zeilen muessen also stehen bleiben. Was "deny" statt "warn" bringt:
# eine echte Wildcard-Abhaengigkeit auf ein *fremdes* Crate (`foo = "*"`)
# bricht die CI, statt in einer Warnung unterzugehen.
wildcards = "deny"
allow-wildcard-paths = true

# ---------------------------------------------------------------------------
# Bezugsquellen
# ---------------------------------------------------------------------------
[sources]
# Alles muss von crates.io kommen. Kein git-Dependency, keine fremde
# Registry - beides waere ein Einfallstor, das in Cargo.lock leicht
# uebersehen wird.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
