# cargo-deny Konfiguration fuer redact-rs.
#
# Geprueft wird in CI (siehe .github/workflows/ci.yml, Job "supply-chain"):
#   cargo deny check advisories licenses bans sources
#
# Lokal identisch:
#   cargo install --locked cargo-deny
#   cargo deny check
#
# Hinweis zur Schema-Version: diese Datei ist fuer cargo-deny 0.20.x
# geschrieben (dort sind die frueheren `version = 2`-Schluessel unter
# [advisories]/[licenses] entfallen). Die CI installiert deshalb eine
# festgelegte Version.

[graph]
# Nur die Ziele pruefen, die wir auch ausliefern. Ohne diese Liste wuerde
# cargo-deny auch Abhaengigkeiten fuer z.B. wasm/redox melden, die nie
# gebaut werden.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Optionale Features (pdfium) sind nicht Teil der Release-Artefakte.
all-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Sicherheitsmeldungen (RustSec)
# ---------------------------------------------------------------------------
[advisories]
# Zurueckgezogene ("yanked") Crate-Versionen sind ein Fehler, kein Hinweis.
yanked = "deny"
unmaintained = "workspace"

ignore = [
    # ------------------------------------------------------------------
    # BEFRISTET. Nicht dauerhaft stehen lassen.
    #
    # RUSTSEC-2026-0187 - lopdf 0.34: Stack Overflow (Absturz) beim Parsen
    # tief verschachtelter PDF-Objektstrukturen. Da redact-rs genau das tut,
    # was die Meldung beschreibt - fremde, potenziell praeparierte PDFs
    # einlesen - ist das relevant und nicht bloss theoretisch.
    #
    # STAND: reproduziert (400-kB-Datei mit 200 000 offenen "[", Exit 134),
    # und zwar in allen drei Varianten: als gewoehnliches Objekt, versteckt
    # in einem Flate-komprimierten Objekt-Stream und im Seiteninhalt.
    #
    # ENTSCHAERFT, NICHT BEHOBEN. redact_pdf::document::prescan prueft die
    # Rohbytes *vor* dem Parsen auf Klammertiefe - auch in ausgepackten
    # Streams - und lehnt solche Dateien mit einer Meldung ab. Die
    # Schwachstelle in lopdf selbst besteht weiter; die Vorpruefung nimmt ihr
    # nur die Reichweite. Siehe SECURITY.md, Abschnitt "Restrisiken".
    #
    # WARUM KEIN UPDATE: lopdf 0.42 loest die Meldung, verlangt aber
    # Anpassungen in crates/redact-pdf/src/audit_bytes.rs (Dictionary::type_is
    # entfaellt, Stream::filters() liefert Vec<&[u8]> statt Vec<String>) und
    # in crates/redact-pdf/src/document.rs (Object::type_name() liefert
    # &[u8]). lopdf 0.44 verlangt zusaetzlich Anpassungen in content.rs,
    # ops.rs und redact.rs (Document::get_page_content() liefert Vec<u8>
    # statt Result). Ausserdem aendert 0.42 das Verhalten bei inkrementellen
    # Updates (has_incremental_history) und bei eingebetteten Bildern - beides
    # ist zu pruefen, bevor umgestellt wird.
    #
    # Beim Anheben von lopdf auf >= 0.42 diesen Eintrag ersatzlos loeschen.
    { id = "RUSTSEC-2026-0187", reason = "lopdf 0.34: Stack Overflow bei tief verschachtelten PDFs. Durch die Vorpruefung in redact_pdf::document::prescan entschaerft (siehe SECURITY.md). Behoben ab lopdf 0.42; das Update braucht Anpassungen in audit_bytes.rs und document.rs. Diesen Eintrag beim lopdf-Update ersatzlos entfernen." },
]

# ---------------------------------------------------------------------------
# Lizenzen
# ---------------------------------------------------------------------------
[licenses]
# Alles, was im Abhaengigkeitsgraphen tatsaechlich vorkommt (ermittelt ueber
# `cargo metadata`), und nichts darueber hinaus. Neue Lizenzen sollen
# auffallen, nicht durchrutschen.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    # SIL Open Font License 1.1 - gilt fuer die mitgelieferten Schriften in
    # crates/redact-render/assets/fonts/ und fuer die Standardschriften in
    # epaint_default_fonts. Die OFL verlangt, dass ihr Text mitgeliefert
    # wird; die Release-Workflows legen LICENSE-OFL.txt deshalb ins Archiv.
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# `r-efi` ist "MIT OR Apache-2.0 OR LGPL-2.1-or-later" - die ODER-Verknuepfung
# ist ueber MIT erfuellt, LGPL wird bewusst *nicht* erlaubt.

[[licenses.exceptions]]
# epaint_default_fonts ist "(MIT OR Apache-2.0) AND OFL-1.1 AND
# LicenseRef-UFL-1.0". Die Ubuntu Font Licence gilt nur fuer dieses eine
# Crate (Ubuntu-Light in den egui-Standardschriften) und wird deshalb nicht
# global erlaubt.
name = "epaint_default_fonts"
allow = ["LicenseRef-UFL-1.0"]

# ---------------------------------------------------------------------------
# Doppelte Versionen
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
# "warn" statt "deny", und das ist eine bewusste Kroete:
# Die Workspace-internen Pfad-Abhaengigkeiten (redact-core & Co.) haben keine
# Versionsangabe und zaehlen damit als Wildcard. `allow-wildcard-paths`
# greift dafuer nicht, weil cargo-deny die Crates als veroeffentlichbar
# ansieht - sie tragen kein `publish = false`. Sobald in den
# crates/*/Cargo.toml `publish = false` steht (die Crates gehen ohnehin nicht
# nach crates.io), kann hier "deny" stehen und der Eintrag unten entfallen.
wildcards = "warn"
allow-wildcard-paths = true

# ---------------------------------------------------------------------------
# Bezugsquellen
# ---------------------------------------------------------------------------
[sources]
# Alles muss von crates.io kommen. Kein git-Dependency, keine fremde
# Registry - beides waere ein Einfallstor, das in Cargo.lock leicht
# uebersehen wird.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
