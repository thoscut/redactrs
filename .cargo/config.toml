# Cargo-Konfiguration fuer redact-rs.
#
# Cross-Compiling nach Windows (x86_64-pc-windows-gnu) mit der mingw-w64
# Toolchain. Unter Debian/Ubuntu:
#
#     sudo apt-get install -y mingw-w64
#     rustup target add x86_64-pc-windows-gnu
#
# Hinweis: Der offizielle GitHub-Release wird mit dem MSVC-Target
# (x86_64-pc-windows-msvc) auf einem echten Windows-Runner gebaut
# (siehe .github/workflows/release.yml). Die Eintraege hier sind fuer
# lokale Cross-Builds gedacht (scripts/build-windows.sh).
#
# ---------------------------------------------------------------------------
# Statische Linux-CLI (x86_64-unknown-linux-musl)
#
# Der glibc-Build der CLI verlangt eine recht neue glibc und laeuft damit
# nicht auf Debian 12, RHEL/Alma/Rocky 8+9 oder Ubuntu 22.04. Der Release
# liefert deshalb zusaetzlich ein statisch gegen musl gelinktes CLI-Archiv
# aus. Lokal nachbauen:
#
#     rustup target add x86_64-unknown-linux-musl
#     cargo build --release --locked \
#         --target x86_64-unknown-linux-musl \
#         -p redact-cli --no-default-features
#
# Es ist bewusst *kein* [target.x86_64-unknown-linux-musl]-Abschnitt noetig:
# ohne die GUI (--no-default-features) hat der Abhaengigkeitsgraph keine
# C-Anteile, und rustc linkt mit der mitgelieferten musl-libc selbst
# (static-pie). Weder musl-tools noch ein eigener Linker werden gebraucht.
# ---------------------------------------------------------------------------

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
rustflags = [
    # Die C-Runtime-Bibliotheken statisch dazulinken, damit die .exe ohne
    # mitgelieferte libgcc_s_seh-1.dll / libwinpthread-1.dll laeuft.
    "-C", "link-args=-static-libgcc -static-libstdc++ -Wl,-Bstatic -lpthread -Wl,-Bdynamic",
]

# ---------------------------------------------------------------------------
# MSRV-bewusste Auflösung
#
# Der Workspace steht auf `resolver = "2"`; der wählt bei `cargo update`
# stur die neueste semver-verträgliche Fassung, auch wenn sie eine höhere
# `rust-version` verlangt als die zugesagte (Cargo.toml, derzeit 1.88).
# Nachgemessen am Stand 0.8.0: ein volles `cargo update` zog
# serde-saphyr 1.3.0 und uuid 1.29.0 (beide rust-version 1.89) - der Job
# "msrv" wäre rot geworden. Mit "fallback" nimmt cargo die neueste Fassung,
# die zur `rust-version` passt, und nur wenn es keine gibt, eine neuere.
# Stabil seit cargo 1.84; die MSRV-Toolchain 1.88 versteht den Schlüssel.
[resolver]
incompatible-rust-versions = "fallback"
