[package]
name = "redact-cli"
description = "The redact-rs program: command line and windowed launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "redact-rs"
path = "src/main.rs"

# Fensterfassung ohne Konsolenfenster (siehe Modulkommentar der Datei).
[[bin]]
name = "redact-rs-gui"
path = "src/bin/redact-rs-gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:redact-gui", "dep:rfd"]

[dependencies]
redact-core.workspace = true
redact-pdf.workspace = true
redact-patterns.workspace = true
# Die Verarbeitungskette — dasselbe Crate, das die Oberfläche benutzt. Die
# Kommandozeile hat davon keine eigene Fassung mehr.
redact-pipeline.workspace = true
redact-gui = { workspace = true, optional = true }
# Nur für die Fehlermeldung der Fensterfassung: ohne Konsole gäbe es sonst
# gar keine. Gleiche Fassung wie in redact-gui, also kein zusätzlicher Baum.
rfd = { version = "0.15", optional = true }

clap.workspace = true
# Für die Zusammenfassung eines Stapels als JSON (`--json` mit mehreren
# Dateien). Steht bereits im Baum, es kommt keine Abhängigkeit hinzu.
serde.workspace = true
serde_json.workspace = true

# Genau ein Aufruf in src/dumpable.rs, damit ein Absturz den Klartext des
# Dokuments nicht in einen Kernabzug schreibt: prctl(PR_SET_DUMPABLE, 0) unter
# Linux, setrlimit(RLIMIT_CORE, 0) auf den übrigen Unix-Systemen. Unter Windows
# gäbe es ein Gegenstück — `WerAddExcludedApplication` (siehe src/dumpable.rs
# und SECURITY.md) —, es ist aber nicht umgesetzt und stünde ohnehin nicht in
# libc. Der Windows-Bau ruft hier nichts auf und braucht die Abhängigkeit nicht.
# `libc` liegt über lopdf → getrandom ohnehin in jedem Bau; es kommt keine
# Abhängigkeit in den Baum, nur eine ausgesprochene.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
redact-pdf.workspace = true
redact-core.workspace = true
serde_json.workspace = true
# Nur für die Tests: kaputte PDFs von Hand bauen.
lopdf.workspace = true
