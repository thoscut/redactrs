[package]
name = "redact-render"
description = "Glyph outline extraction and rasterization for the redact-rs page preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
redact-core.workspace = true
redact-pdf.workspace = true
lopdf.workspace = true

# skrifa liest sowohl TrueType-`glyf` als auch PostScript-`CFF`/`CFF2`.
#
# Die Reihe 0.33 war urspruenglich wegen der damals zugesagten MSRV 1.75
# festgenagelt. Dieser Grund ist entfallen — die MSRV steht jetzt auf dem
# real erreichbaren Wert 1.88, gemessen statt behauptet. Die Pinnung bleibt
# trotzdem, aber aus einem anderen Grund: skrifa liest fremde Fontprogramme
# aus fremden PDFs, und ein Versionssprung dort ist eine Aenderung an genau
# der Stelle, an der praeparierte Eingaben ankommen. Anheben ist in Ordnung,
# aber als eigener Schritt mit eigener Pruefung, nicht nebenbei.
skrifa = { version = "0.33.2", default-features = false, features = ["std"] }
# Rasterizer. `png-format` wird nicht gebraucht — wir liefern rohes RGBA8.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
