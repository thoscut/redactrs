[package]
name = "redact-gui"
description = "egui based desktop UI for reviewing and drawing redactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The default preview backend is pure Rust: it re-draws the extracted text runs
# at their real user-space coordinates. Enabling `pdfium` renders pixel-exact
# page images instead, but requires a `libpdfium` shared library at runtime.
default = []
pdfium = ["dep:pdfium-render", "dep:image", "dep:egui_extras"]

[dependencies]
redact-core.workspace = true
redact-pdf.workspace = true
redact-patterns.workspace = true
redact-booking.workspace = true

lopdf.workspace = true
serde_json.workspace = true

eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
rfd = "0.15"

egui_extras = { version = "0.29", features = ["image"], optional = true }
pdfium-render = { version = "0.8", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
