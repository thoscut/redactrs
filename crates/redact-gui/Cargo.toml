[package]
name = "redact-gui"
description = "egui based desktop UI for reviewing and drawing redactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
redact-core.workspace = true
redact-pdf.workspace = true
redact-patterns.workspace = true
# Die Verarbeitungskette: Analyse, Schwärzung, Schreibpfad, Audit-Log. Die
# Oberfläche hat davon keine eigene Fassung mehr — das war der Grund, warum
# beide Programme auseinandergelaufen sind.
redact-pipeline.workspace = true
# Steht (noch) nicht in `[workspace.dependencies]` der Wurzel — die gehört
# einem anderen Zuständigkeitsbereich, deshalb hier der direkte Pfad.
redact-render = { path = "../redact-render" }

lopdf.workspace = true
serde_json.workspace = true

eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
rfd = "0.15"
