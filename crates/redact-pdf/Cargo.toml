[package]
name = "redact-pdf"
description = "PDF text extraction, true redaction (content-stream rewriting) and leak checking for redact-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
redact-core.workspace = true
lopdf.workspace = true
# Bilddaten in PDFs: FlateDecode (roh, ohne lopdf-Umweg) und JPEG.
flate2 = "1"
# Teilstring-Suche im Leck-Detektor (audit_bytes): liegt ohnehin im Graphen,
# siehe Cargo.lock.
memchr = "2"
# Ein Automat für alle Suchbegriffe im Leck-Detektor (audit_bytes): liegt
# ohnehin im Graphen (über `regex`), siehe Cargo.lock.
aho-corasick = "1"
# LZWDecode mit begrenztem Ausgabepuffer (filters): dieselbe Bibliothek, die
# lopdf benutzt — liegt ohnehin im Graphen, siehe Cargo.lock.
weezl = "0.1"
zune-jpeg = "0.5"
