[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thoscut/redactrs"

[workspace.dependencies]
redact-core = { path = "crates/redact-core" }
redact-pdf = { path = "crates/redact-pdf" }
redact-patterns = { path = "crates/redact-patterns" }
redact-booking = { path = "crates/redact-booking" }
redact-pipeline = { path = "crates/redact-pipeline" }
redact-gui = { path = "crates/redact-gui" }

lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
fancy-regex = "0.14"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
